name: Isolated CPU TTS feasibility
on:
  push:
    branches: [research/cloud-tts-feasibility]
    paths: [research/tts_benchmark.py, .github/workflows/tts-feasibility.yml]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: python -m pip install kokoro-onnx==0.6.1 soundfile==0.13.1
      - run: python research/tts_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-tts-qualification
          path: results/
          retention-days: 1
